<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#101329">
<title>Крестики-нолики</title>
<style>
:root{color-scheme:dark;--bg:#101329;--panel:#191e3b;--muted:#aab0d0;--x:#62e6ff;--o:#c69bff;--accent:#8d7bff}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:22px;background:radial-gradient(ellipse at 20% 0%,#293064 0,transparent 45%),radial-gradient(ellipse at 100% 100%,#3b225c 0,transparent 40%),var(--bg);font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#fff}
.app{width:min(100%,440px);padding:26px;border:1px solid #ffffff20;border-radius:28px;background:#171b35dc;box-shadow:0 24px 80px #0008;backdrop-filter:blur(12px)}
h1{margin:0;text-align:center;font-size:clamp(27px,7vw,36px);letter-spacing:-1px}
.sub{text-align:center;color:var(--muted);margin:7px 0 24px;font-size:14px}
.score{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:18px}
.player{padding:13px;border-radius:16px;background:#ffffff09;border:1px solid #ffffff15;text-align:center}
.player strong{display:block;font-size:25px;margin-bottom:2px}
.player span{font-size:12px;color:var(--muted)}
.x{color:var(--x)}.o{color:var(--o)}
.status{min-height:48px;display:grid;place-items:center;text-align:center;color:#e8eaff;font-weight:650;margin:8px 0 14px}
.board{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.cell{aspect-ratio:1;border:1px solid #ffffff19;border-radius:18px;background:linear-gradient(145deg,#252b50,#1b203e);font-size:clamp(42px,13vw,66px);font-weight:800;display:grid;place-items:center;cursor:pointer;transition:transform .15s,border-color .15s,background .15s;touch-action:manipulation}
.cell:active{transform:scale(.96)}.cell:disabled{cursor:default}
.cell.win{background:#37346a;border-color:#a99cff;box-shadow:0 0 22px #9b86ff55}
.actions{display:flex;gap:10px;margin-top:20px}
button.action{flex:1;border:0;border-radius:14px;padding:14px 12px;font-size:14px;font-weight:700;cursor:pointer;color:white;background:linear-gradient(110deg,#7769ff,#a56cf4)}
button.secondary{background:#ffffff12;border:1px solid #ffffff20}
.note{text-align:center;color:#9098bd;font-size:11px;margin:17px 0 0}
</style>
</head>
<body>
<main class="app">
  <h1>Крестики-нолики</h1>
  <p class="sub">Маленькая битва умов ✨</p>
  <section class="score" aria-label="Счёт">
    <div class="player"><strong class="x">✕ <b id="scoreX">0</b></strong><span>Игрок X</span></div>
    <div class="player"><strong class="o">○ <b id="scoreO">0</b></strong><span>Игрок O</span></div>
  </section>
  <div class="status" id="status" aria-live="polite">Ход игрока X</div>
  <section class="board" id="board" aria-label="Игровое поле">
    <button class="cell" aria-label="Клетка 1"></button><button class="cell" aria-label="Клетка 2"></button><button class="cell" aria-label="Клетка 3"></button>
    <button class="cell" aria-label="Клетка 4"></button><button class="cell" aria-label="Клетка 5"></button><button class="cell" aria-label="Клетка 6"></button>
    <button class="cell" aria-label="Клетка 7"></button><button class="cell" aria-label="Клетка 8"></button><button class="cell" aria-label="Клетка 9"></button>
  </section>
  <div class="actions">
    <button class="action" id="restart">Новая игра</button>
    <button class="action secondary" id="reset">Сбросить счёт</button>
  </div>
  <p class="note">Игра для двух игроков на одном устройстве</p>
</main>
<script>
const cells=[...document.querySelectorAll('.cell')],statusEl=document.getElementById('status');
const scoreX=document.getElementById('scoreX'),scoreO=document.getElementById('scoreO');
const wins=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
let board=Array(9).fill(''),turn='X',finished=false,scores={X:0,O:0};
function paintStatus(text){statusEl.textContent=text}
function play(i){
 if(finished||board[i])return;
 board[i]=turn;cells[i].textContent=turn==='X'?'✕':'○';cells[i].classList.add(turn.toLowerCase());cells[i].disabled=true;
 const line=wins.find(combo=>combo.every(n=>board[n]===turn));
 if(line){finished=true;line.forEach(n=>cells[n].classList.add('win'));scores[turn]++;scoreX.textContent=scores.X;scoreO.textContent=scores.O;paintStatus(`🎉 Игрок ${turn} победил!`);cells.forEach(c=>c.disabled=true);return}
 if(board.every(Boolean)){finished=true;paintStatus('Ничья! Хорошая партия 🤝');return}
 turn=turn==='X'?'O':'X';paintStatus(`Ход игрока ${turn}`);
}
function newGame(){board=Array(9).fill('');turn='X';finished=false;cells.forEach(c=>{c.textContent='';c.disabled=false;c.classList.remove('x','o','win')});paintStatus('Ход игрока X')}
cells.forEach((c,i)=>c.addEventListener('click',()=>play(i)));
document.getElementById('restart').addEventListener('click',newGame);
document.getElementById('reset').addEventListener('click',()=>{scores={X:0,O:0};scoreX.textContent='0';scoreO.textContent='0';newGame()});
</script>
</body>
</html>
